<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sedang Offline - Lapor Bersih Kampus</title>

    <meta name="theme-color" content="#198754">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .offline-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        .offline-icon {
            font-size: 65px;
            color: #198754;
            margin-bottom: 20px;
        }

        h2 {
            color: #198754;
            font-weight: bold;
        }

        p {
            color: #6c757d;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="offline-card">

        <div class="offline-icon">
            <i>📡</i>
        </div>

        <h2>Kamu Sedang Offline</h2>

        <p class="mt-3">
            Sepertinya koneksi internet kamu sedang terputus.
            Jangan khawatir, Lapor Bersih Kampus akan kembali
            bisa digunakan setelah koneksi internet tersedia.
        </p>

        <button class="btn btn-success mt-3" onclick="window.location.reload()">
            Coba Hubungkan Kembali
        </button>

        <div class="mt-4 text-muted small">
            Lapor Bersih Kampus
        </div>

    </div>

</body>

</html>
